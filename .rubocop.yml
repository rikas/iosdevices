plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'pkg/**/*'
    - 'vendor/**/*'

# Releases are published by hand without enforcing MFA on RubyGems.
Gemspec/RequireMFA:
  Enabled: false

# The device list is data: one long hash, and arrays of strings that read better
# as ['iPad', 'Wi-Fi'] than %w[iPad Wi-Fi].
Metrics/ModuleLength:
  Exclude:
    - 'lib/ios/devices/device_types.rb'

Style/WordArray:
  Exclude:
    - 'lib/ios/devices/device_types.rb'
